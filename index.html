<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sawicki</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: #4A3B2E;
  }

  /* ---------- Full-viewport hero image ---------- */
  .hero {
    height: 100vh;
    width: 100%;
    background-image: url('images/hero.jpg');
    background-size: cover;
    background-position: center;
    background-color: #A8D0E6; /* shows while the image loads, or if it's missing */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 32px 24px;
  }

  /* ---------- Nav (top, plain text) ---------- */
  nav {
    display: flex;
    gap: 32px;
  }

  nav a {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
    color: #4A3B2E;
    text-decoration: none;
    text-shadow: 0 1px 4px rgba(255,255,255,0.6);
  }

  nav a:hover {
    text-decoration: underline;
  }

  nav a:focus-visible {
    outline: 2px solid #4A3B2E;
    outline-offset: 4px;
  }

  /* ---------- Site name (bottom, plain text) ---------- */
  .site-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: #4A3B2E;
    text-shadow: 0 1px 4px rgba(255,255,255,0.6);
  }

  @media (max-width: 480px) {
    nav { gap: 20px; }
    nav a { font-size: 0.95rem; }
  }
</style>
</head>
<body>

  <div class="hero">

    <nav>
      <a href="about.html">About</a>
      <a href="projects.html">My work</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="site-name">Shrum</div>

  </div>

</body>
</html>
